# 每天北京时间 09:17 合并原仓库 main 的更新，也可以在 Actions 页面手动运行。
# 保留 fork 自己的提交；遇到冲突时失败，不强制覆盖。
name: Sync upstream

on:
  schedule:
    - cron: '17 1 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Sync main from upstream
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          gh api --method POST "repos/$REPO/merge-upstream" \
            -f branch=main
